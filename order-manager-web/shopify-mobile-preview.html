<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrintMO Shopify Mobile Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-columns: minmax(220px, 280px) auto;
      gap: 24px;
      align-items: start;
      padding: 24px;
      background: #dfe5ee;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    aside {
      display: grid;
      gap: 14px;
      padding: 18px;
      border-radius: 12px;
      background: #ffffff;
    }
    h1 { margin: 0; font-size: 1.1rem; }
    p { margin: 0; color: #475569; font-size: 0.86rem; line-height: 1.45; }
    label { display: grid; gap: 6px; font-size: 0.78rem; font-weight: 750; }
    input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }
    button {
      min-height: 42px;
      border: 0;
      border-radius: 9px;
      background: #1a73e8;
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    iframe {
      width: 393px;
      height: 650px;
      border: 0;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }
  </style>
</head>
<body>
  <aside>
    <h1>Shopify embedded mobile</h1>
    <p>This frame intentionally removes the height normally consumed by Shopify Admin chrome. Fixture data is local-only.</p>
    <label>
      Frame width
      <input id="frame-width" type="number" min="320" max="500" value="393" />
    </label>
    <label>
      Frame height
      <input id="frame-height" type="number" min="480" max="900" value="650" />
    </label>
    <button id="apply-size" type="button">Apply viewport</button>
    <button id="open-detail" type="button">Open fixture detail</button>
  </aside>
  <iframe id="preview-frame" title="PrintMO embedded mobile preview" src="./index.html?fixture=1"></iframe>
  <script>
    const frame = document.getElementById('preview-frame');
    document.getElementById('apply-size').addEventListener('click', () => {
      frame.style.width = `${document.getElementById('frame-width').value}px`;
      frame.style.height = `${document.getElementById('frame-height').value}px`;
    });
    document.getElementById('open-detail').addEventListener('click', () => {
      frame.contentWindow.__printmoPreviewOpenDetail?.();
    });
  </script>
</body>
</html>
