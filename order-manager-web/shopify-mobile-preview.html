<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrintMO Shopify Mobile Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-columns: minmax(220px, 280px) auto;
      gap: 24px;
      align-items: start;
      padding: 24px;
      background: #dfe5ee;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    aside {
      display: grid;
      gap: 14px;
      padding: 18px;
      border-radius: 12px;
      background: #ffffff;
    }
    h1 { margin: 0; font-size: 1.1rem; }
    p { margin: 0; color: #475569; font-size: 0.86rem; line-height: 1.45; }
    label { display: grid; gap: 6px; font-size: 0.78rem; font-weight: 750; }
    input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }
    button {
      min-height: 42px;
      border: 0;
      border-radius: 9px;
      background: #1a73e8;
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    iframe {
      width: 393px;
      height: 650px;
      border: 0;
      background: #ffffff;
      display: block;
    }
    .preview-device { width: max-content; overflow: hidden; border-radius: 18px; background: #000; }
    .preview-native-header { height: 112px; padding: 16px; color: #fff; background: #000; }
    .preview-native-header small { display: flex; justify-content: space-between; font-size: 14px; margin: 0 8px 30px; }
    .preview-native-header strong { display: block; font-size: 17px; }
    .preview-native-footer { height: 84px; padding: 10px 16px 18px; background: #F3F4F6; position: relative; display: flex; align-items: start; justify-content: space-around; color: #526174; }
    .preview-native-footer span { display: grid; place-items: center; width: 38px; height: 38px; background: #fff; border-radius: 50%; font-size: 18px; }
    .preview-native-footer::after { content: ''; position: absolute; width: 130px; height: 4px; background: #000; bottom: 8px; left: calc(50% - 65px); border-radius: 3px; }
  </style>
</head>
<body>
  <aside>
    <h1>Shopify embedded mobile</h1>
    <p>The black header and native bottom bar simulate Shopify host chrome. Frame height is the remaining app viewport, including PrintMO navigation. This is a simulation, not authenticated Shopify iOS acceptance.</p>
    <label>
      Frame width
      <input id="frame-width" type="number" min="320" max="500" value="393" />
    </label>
    <label>
      Frame height
      <input id="frame-height" type="number" min="480" max="900" value="650" />
    </label>
    <button id="apply-size" type="button">Apply viewport</button>
    <button id="open-detail" type="button">Open fixture detail</button>
  </aside>
  <div class="preview-device">
    <div class="preview-native-header" aria-hidden="true"><small><span>4:51</span><span>● ▰</span></small><strong>Print-MO Order Manager⌄</strong></div>
    <iframe id="preview-frame" title="PrintMO embedded mobile preview" src="./index.html?fixture=1"></iframe>
    <div class="preview-native-footer" aria-hidden="true"><span>⌕</span><span>⌂</span><span>▱</span><span>≡</span><span>●</span></div>
  </div>
  <script>
    const frame = document.getElementById('preview-frame');
    document.getElementById('apply-size').addEventListener('click', () => {
      frame.style.width = `${document.getElementById('frame-width').value}px`;
      frame.style.height = `${document.getElementById('frame-height').value}px`;
    });
    document.getElementById('open-detail').addEventListener('click', () => {
      frame.contentWindow.__printmoPreviewOpenDetail?.();
    });
  </script>
</body>
</html>
