# Shopify App Configuration for PrintMO Live API Sync
name = "Print-MO Order Manager"
client_id = "119d00a9567e8b0d647409f27c939d5d"
application_url = "https://print-mo-order-manager.pages.dev"
embedded = true

[auth]
redirect_urls = [ "https://print-mo-order-manager.pages.dev/auth/callback" ]

[access_scopes]
scopes = "read_orders,write_orders,read_all_orders,read_merchant_managed_fulfillment_orders,read_third_party_fulfillment_orders"

[order.metafields.printmo.production_state_v1]
name = "PrintMO production state"
description = "Canonical PrintMO workflow state managed by the Print-MO Order Manager."
type = "json"
access.admin = "merchant_read"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "https://order-manager-proxy.printmobusiness.workers.dev/order-manager/v1/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "https://order-manager-proxy.printmobusiness.workers.dev/order-manager/v1/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled" ]
  uri = "https://order-manager-proxy.printmobusiness.workers.dev/order-manager/v1/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "https://order-manager-proxy.printmobusiness.workers.dev/order-manager/v1/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://order-manager-proxy.printmobusiness.workers.dev/order-manager/v1/webhooks/shopify"
